<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>MCP Web Chat</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea {
            width: 100%;
            height: 200px;
        }

        button {
            margin-top: 12px;
            padding: 10px 20px;
            background-color: bisque;
        }

        select {
            margin-top: 12px;
            padding: 8px;
        }

        pre {
            white-space: pre-wrap;
            background: #f5f5f5;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .login {
            margin-bottom: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>MCP Web Chat</h1>

    {% if user %}
        <div class="login">
            Logged in as: <strong>{{ user }}</strong>
            <br>
            <a href="/logout">Logout</a>
        </div>

        <label for="backend"><strong>Model backend:</strong></label>
        <br>
        <select id="backend">
            <option value="openrouter" selected>OpenRouter</option>
            <option value="ollama">Local model</option>
        </select>

        <br><br>

        <textarea id="msg" placeholder="Ask anything, external tools might be involved"></textarea>
        <br>
        <button onclick="send_message()">Send</button>

        <pre id="out">Response will appear here...</pre>
    {% else %}
        <div class="login">
            <a href="/login">Login with GitHub</a>
        </div>

        <pre>Please log in with GitHub before using the chat.</pre>
    {% endif %}

<script>
    async function send_message() {
        const message = document.getElementById("msg").value;
        const backend = document.getElementById("backend").value;
        const out = document.getElementById("out");

        out.textContent = "Thinking...\n";

        const res = await fetch("/chat-stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: message,
                backend: backend
            })
        });
        if (!res.ok || !res.body) {
            out.textContent = "Request failed. Backend did not return a stream.";
            return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";
        let logs = "";
        let finalAnswer = "";

        while (true) {
            const { value, done } = await reader.read();

            if (done) {
                break;
            }

            buffer += decoder.decode(value, { stream: true });

            const events = buffer.split("\n\n");
            buffer = events.pop();

            for (const event of events) {
                if (!event.startsWith("data: ")) {
                    continue;
                }

                const jsonText = event.replace("data: ", "");

                try {
                    const data = JSON.parse(jsonText);

                    if (data.type === "log") {
                        logs += "• " + data.content + "\n";

                        out.textContent =
                            "Backend activity:\n" +
                            "--------------------\n" +
                            logs +
                            "\nFinal answer:\n" +
                            "--------------------\n" +
                            "Still generating...";
                    }

                    if (data.type === "final") {
                        finalAnswer = data.content;

                        out.textContent =
                            "Backend activity:\n" +
                            "--------------------\n" +
                            logs +
                            "\nFinal answer:\n" +
                            "--------------------\n" +
                            finalAnswer;
                    }

                    if (data.type === "error") {
                        out.textContent =
                            "Backend activity:\n" +
                            "--------------------\n" +
                            logs +
                            "\nError:\n" +
                            "--------------------\n" +
                            data.content;
                    }

                } catch (err) {
                    out.textContent += "\nFailed to parse stream event: " + err;
                }
            }
        }
    }
</script>
</body>

</html>
